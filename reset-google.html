<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Google OAuth — Gabriel</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:#f6f7fb; color:#111827; margin:0; min-height:100vh; display:grid; place-items:center; }
    .box { width:min(560px, calc(100vw - 32px)); background:#fff; border:1px solid #e5e7eb; border-radius:24px; padding:28px; box-shadow:0 18px 60px rgba(15,23,42,.10); }
    h1 { margin:0 0 10px; font-size:24px; }
    p { color:#4b5563; line-height:1.55; }
    button, a { display:inline-flex; align-items:center; justify-content:center; border:0; border-radius:14px; padding:12px 16px; background:#2563eb; color:white; font-weight:700; text-decoration:none; cursor:pointer; }
    .muted { font-size:13px; color:#6b7280; margin-top:16px; }
    code { background:#f3f4f6; padding:2px 6px; border-radius:8px; }
  </style>
</head>
<body>
  <main class="box">
    <h1>Reset Google OAuth</h1>
    <p>Use esta tela quando o Google mostrar <code>deleted_client</code>. Ela limpa tokens antigos, cache do PWA e service worker para forçar o app a usar o Client ID novo.</p>
    <button onclick="resetNow()">Limpar cache e voltar para login</button>
    <p class="muted" id="status">Client ID novo configurado: <code>864884431271-d7titgkf021ljjjsueh1vrii9erh6fbv.apps.googleusercontent.com</code></p>
  </main>

  <script>
    async function resetNow() {
      const status = document.getElementById('status');
      status.textContent = 'Limpando sessão Google, caches e service workers...';

      const keys = Object.keys(localStorage).filter(k =>
        k.startsWith('gabriel_google') ||
        k === 'gabriel_oauth_state' ||
        k === 'gabriel_session'
      );
      keys.forEach(k => localStorage.removeItem(k));

      try {
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(names.map(name => caches.delete(name)));
        }
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(reg => reg.unregister()));
        }
      } catch (err) {
        console.warn(err);
      }

      status.textContent = 'Pronto. Redirecionando...';
      setTimeout(() => location.replace('/login.html?v=20260515-oauth-hardcoded-v2'), 700);
    }
  </script>
</body>
</html>
